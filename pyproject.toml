[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnit2i"
version = "0.1.0"
description = "Table-to-image models for multimodal survival and cross-modal inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Peng Li"}]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["omnit2i*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
