[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnit2i"
version = "0.1.0"
description = "Table-to-image models for multimodal survival and cross-modal inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Peng Li"}]
dependencies = ["torch>=2.0", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.scripts]
omnit2i-train-ablation = "omnit2i.training.ablations:main"
omnit2i-analyze-clinical = "omnit2i.analysis.clinical:main"
omnit2i-prepare-scanb-clinical = "omnit2i.external:clinical_main"
omnit2i-predict-external-rna = "omnit2i.external:main"
omnit2i-summarize-external-rna = "omnit2i.external:summary_main"
omnit2i-aggregate-subsets = "omnit2i.analysis.aggregation:main"
omnit2i-split-cohort = "omnit2i.preprocessing.splits:main"
omnit2i-prepare-targets = "omnit2i.preprocessing.feature_targets:main"
omnit2i-train-fold = "omnit2i.training.workflow:main"
omnit2i-analyze-ipcw = "omnit2i.analysis.ipcw:main"
omnit2i-build-rna-cohort = "omnit2i.preprocessing.build_rna_cohort:main"
omnit2i-build-cnv-cohort = "omnit2i.preprocessing.build_cnv_cohort:main"
omnit2i-build-rna-cnv-master = "omnit2i.preprocessing.build_rna_cnv_master:main"
omnit2i-build-protein-master = "omnit2i.preprocessing.build_protein_master:main"
omnit2i-build-methylation-cohort = "omnit2i.preprocessing.build_methylation_cohort:main"
omnit2i-build-methylation-master = "omnit2i.preprocessing.build_methylation_master:main"
omnit2i-build-he-master = "omnit2i.preprocessing.build_he_master:main"
omnit2i-query-he = "omnit2i.preprocessing.he_metadata:main"
omnit2i-sample-he = "omnit2i.preprocessing.he_patches:main"
omnit2i-sample-extra-he = "omnit2i.preprocessing.he_extra_patches:main"
omnit2i-embed-he = "omnit2i.preprocessing.he_case_embeddings:main"
omnit2i-embed-extra-he = "omnit2i.preprocessing.he_slide_embeddings:main"
omnit2i-pool-he = "omnit2i.preprocessing.he_multislide:main"
omnit2i-map-methylation = "omnit2i.preprocessing.methylation_map:main"
omnit2i-aggregate-methylation = "omnit2i.preprocessing.methylation_aggregation:main"
omnit2i-prepare-rna = "omnit2i.preprocessing.rna:main"
omnit2i-prepare-omics = "omnit2i.preprocessing.omics:main"
omnit2i-train-rna = "omnit2i.training.rna:main"
omnit2i-train-molecular = "omnit2i.training.rna:main"
omnit2i-train-fusion = "omnit2i.training.fusion:main"
omnit2i-train-joint = "omnit2i.training.crossmodal:main"
omnit2i-evaluate-subsets = "omnit2i.evaluation:main"

[project.optional-dependencies]
analysis = ["scikit-survival>=0.25", "lifelines>=0.30", "numba>=0.60", "openpyxl>=3.1"]
data = ["scikit-learn>=1.3", "requests>=2.28"]
he = ["Pillow>=9", "tiffslide>=2", "torchvision>=0.15", "timm>=1.0.3", "tqdm>=4"]
test = ["pytest>=7"]
training = ["scikit-survival>=0.25"]

[tool.setuptools.packages.find]
include = ["omnit2i*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
